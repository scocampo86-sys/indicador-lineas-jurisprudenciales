<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Indicador de líneas jurisprudenciales</title>
<style>
/* ===================== Tokens de diseño ===================== */
/* Paleta sobria jurídica/seguros: azul marino como acento, neutros con sesgo azul.
   Estados semánticos (ok, alerta, peligro) siempre van acompañados de texto. */
:root{
  --fuente: Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --fondo:#f3f5f9; --superficie:#ffffff; --superficie-2:#eef2f7;
  --texto:#131d2e; --texto-suave:#4f5b70; --borde:#d8dfea;
  --acento:#1d3f66; --acento-txt:#ffffff; --acento-suave:#e4ecf6;
  --ok:#1c6b4a; --ok-suave:#e0f2e8;
  --alerta:#7d5200; --alerta-suave:#fbf0d9;
  --peligro:#a0342a; --peligro-suave:#fae7e3; --error-fondo:#9d3125;
  --grafico:#3a6ea5;
  --est-ok:#1c7a52; --est-alerta:#b07a00; --est-rechazo:#2d5f9a;
  --sombra:0 1px 2px rgba(19,29,46,.05), 0 6px 18px -10px rgba(19,29,46,.14);
  --sombra-alta:0 2px 4px rgba(19,29,46,.06), 0 14px 30px -14px rgba(19,29,46,.25);
  --radio:14px; --radio-s:9px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --fondo:#0c1320; --superficie:#142033; --superficie-2:#1b2940;
    --texto:#e6ecf5; --texto-suave:#9fb0c7; --borde:#273650;
    --acento:#8fbce8; --acento-txt:#0b1626; --acento-suave:#1a2d47;
    --ok:#7ad4a4; --ok-suave:#15311f; --alerta:#f1c978; --alerta-suave:#3a2d12;
    --peligro:#f29a8e; --peligro-suave:#3e1f1b; --error-fondo:#8e3a2f;
    --grafico:#6fa6dc; --est-ok:#3f9d6c; --est-alerta:#b8801f; --est-rechazo:#4f88cc;
    --sombra:none; --sombra-alta:0 14px 30px -14px rgba(0,0,0,.6);
    color-scheme: dark;
  }
}
:root[data-theme="dark"]{
  --fondo:#0c1320; --superficie:#142033; --superficie-2:#1b2940;
  --texto:#e6ecf5; --texto-suave:#9fb0c7; --borde:#273650;
  --acento:#8fbce8; --acento-txt:#0b1626; --acento-suave:#1a2d47;
  --ok:#7ad4a4; --ok-suave:#15311f; --alerta:#f1c978; --alerta-suave:#3a2d12;
  --peligro:#f29a8e; --peligro-suave:#3e1f1b; --error-fondo:#8e3a2f;
  --grafico:#6fa6dc; --est-ok:#3f9d6c; --est-alerta:#b8801f; --est-rechazo:#4f88cc;
  --sombra:none; --sombra-alta:0 14px 30px -14px rgba(0,0,0,.6);
  color-scheme: dark;
}

/* ===================== Base ===================== */
*{box-sizing:border-box}
[hidden]{display:none !important}
body{margin:0;background:var(--fondo);color:var(--texto);font:15px/1.55 var(--fuente);-webkit-font-smoothing:antialiased}
h1{font-size:clamp(1.3rem,1.1rem + .8vw,1.65rem);line-height:1.2;margin:0;letter-spacing:-.01em;text-wrap:balance}
h2{font-size:1rem;margin:0;font-weight:600;letter-spacing:-.005em}
p{margin:0}
button{font:inherit}
time{font-variant-numeric:tabular-nums}
.num{font-variant-numeric:tabular-nums}
.ico{flex:0 0 auto;display:block}
:focus-visible{outline:2px solid var(--acento);outline-offset:2px}
.wrap{max-width:1180px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* ===================== Cabecera y pestañas ===================== */
.cab{background:var(--superficie);border-bottom:1px solid var(--borde)}
.cab-in{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;padding-top:12px;padding-bottom:12px}
.marca{display:flex;align-items:center;gap:10px;min-width:0}
.marca-ico{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;background:var(--acento);color:var(--acento-txt);flex:0 0 auto}
.marca-txt{font-weight:700;font-size:.98rem;letter-spacing:-.01em;line-height:1.25}
.usuario{display:flex;align-items:center;gap:10px;flex-wrap:wrap;min-width:0}
.avatar{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;background:var(--acento-suave);color:var(--acento);font-weight:700;font-size:.9rem;flex:0 0 auto}
.usuario-datos{display:flex;flex-direction:column;align-items:flex-start;gap:2px;min-width:0}
.usuario-nombre{font-weight:600;font-size:.9rem;overflow-wrap:anywhere}
.banda-tabs{background:var(--superficie);border-bottom:1px solid var(--borde)}
.tabs{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs button{display:inline-flex;align-items:center;gap:8px;background:none;border:0;padding:13px 12px;color:var(--texto-suave);border-bottom:2px solid transparent;white-space:nowrap;cursor:pointer;font-weight:500;transition:color .2s,border-color .2s,background .2s;border-radius:8px 8px 0 0}
.tabs button:hover{color:var(--texto);background:var(--superficie-2)}
.tabs button.activa{color:var(--acento);border-bottom-color:var(--acento);font-weight:600}
.contenido{padding-top:22px;padding-bottom:44px}
#main.entra{animation:vista .38s cubic-bezier(.2,.7,.2,1) backwards}
.panel{display:flex;flex-direction:column;gap:16px;min-width:0}
.cab-panel{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap}
.cab-panel .suave{margin-top:4px}
.grupo{display:flex;flex-direction:column;gap:10px}
.grupo h2{display:flex;gap:8px;align-items:center;flex-wrap:wrap}

/* ===================== Elementos ===================== */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;background:var(--acento);color:var(--acento-txt);border:1px solid var(--acento);border-radius:10px;padding:8px 15px;font-weight:600;cursor:pointer;min-height:40px;transition:filter .2s,transform .12s,box-shadow .2s,background .2s;box-shadow:var(--sombra)}
.btn:hover{filter:brightness(1.08);box-shadow:var(--sombra-alta)}
.btn:active{transform:translateY(1px)}
.btn:disabled{opacity:.6;cursor:default;filter:none;transform:none}
.btn.sec{background:var(--superficie);color:var(--acento);border-color:var(--borde)}
.btn.sec:hover{background:var(--superficie-2)}
.btn.pequeno{padding:4px 11px;min-height:30px;font-size:.85rem;font-weight:500;border-radius:8px}
.btn.ancho-100{width:100%}
.btn-ghost{background:none;border:0;color:var(--texto-suave);font-size:1.5rem;cursor:pointer;line-height:1;padding:2px 6px;border-radius:8px}
.btn-ghost:hover{background:var(--superficie-2);color:var(--texto)}
.peligro-txt{color:var(--peligro) !important}
.chip{display:inline-block;font-size:.76rem;font-weight:500;padding:2px 9px;border-radius:999px;background:var(--superficie-2);color:var(--texto-suave);border:1px solid var(--borde);white-space:nowrap}
.chip.ok{color:var(--ok);background:var(--ok-suave);border-color:transparent}
.badge{display:inline-block;font-size:.78rem;font-weight:600;padding:2px 9px;border-radius:999px;background:var(--superficie-2);color:var(--texto-suave);white-space:nowrap}
.b-ok{background:var(--ok-suave);color:var(--ok)}
.b-alerta{background:var(--alerta-suave);color:var(--alerta)}
.b-peligro{background:var(--peligro-suave);color:var(--peligro)}
.aviso{background:var(--acento-suave);color:var(--texto);border-radius:var(--radio-s);padding:12px 14px;font-size:.92rem;border-left:3px solid var(--acento)}
.aviso-pend{display:inline-block;margin-top:4px;color:var(--alerta);font-size:.85rem;font-weight:600}
.msg{font-size:.9rem;min-height:1.3em;color:var(--peligro)}
.msg.ok{color:var(--ok)}
.suave{color:var(--texto-suave);font-size:.88rem}
.conteo{color:var(--texto-suave);font-size:.9rem}
.vacio{color:var(--texto-suave);text-align:center;padding:26px 16px;border:1px dashed var(--borde);border-radius:var(--radio);font-size:.92rem}
.cargando{display:flex;align-items:center;justify-content:center;gap:10px;text-align:center;padding:40px 16px;color:var(--texto-suave)}
.spinner{width:18px;height:18px;border:2px solid var(--borde);border-top-color:var(--acento);border-radius:50%;display:inline-block;animation:girar .8s linear infinite;flex:0 0 auto}
.nota-fija{font-size:.88rem;color:var(--texto-suave);border-left:3px solid var(--borde);padding-left:12px}
.dcha{justify-content:flex-end}
.acciones{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.acc{white-space:nowrap}
.esqueleto{background:linear-gradient(90deg,var(--superficie-2) 0%,var(--superficie) 50%,var(--superficie-2) 100%);background-size:200% 100%;animation:brillo 1.4s linear infinite;border-color:transparent;min-height:112px}

/* ===================== Formularios ===================== */
.formulario{display:flex;flex-direction:column;gap:14px}
label{display:flex;flex-direction:column;gap:6px;font-size:.88rem;color:var(--texto-suave);font-weight:500;min-width:0}
label.check{flex-direction:row;align-items:center;gap:9px;color:var(--texto);font-weight:500}
label.check input{width:auto;min-height:0;margin:0}
input,select,textarea{font:inherit;color:var(--texto);background:var(--superficie);border:1px solid var(--borde);border-radius:var(--radio-s);padding:8px 11px;min-height:40px;width:100%;transition:border-color .2s,box-shadow .2s}
input:hover,select:hover,textarea:hover{border-color:var(--texto-suave)}
textarea{min-height:84px;resize:vertical}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--acento);box-shadow:0 0 0 3px var(--acento-suave)}
input[type="checkbox"]{accent-color:var(--acento);width:18px;height:18px}
fieldset{border:1px solid var(--borde);border-radius:var(--radio-s);padding:12px 14px;display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:8px 16px;margin:0;min-width:0}
legend{padding:0 6px;color:var(--texto-suave);font-size:.9rem}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.grid2 > *{min-width:0}
.grid2 .ancho,.ancho{grid-column:1/-1}
.filtros{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;align-items:end}
.filtros > *{min-width:0}
.filtros .ancho{grid-column:1/-1}
.bloque{background:var(--superficie);border:1px solid var(--borde);border-radius:var(--radio);padding:18px;display:flex;flex-direction:column;gap:12px;box-shadow:var(--sombra);min-width:0}
.bloque h2{margin:0}
.grid-cuenta{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.grid-cuenta > *{min-width:0}
.seg{display:grid;grid-template-columns:1fr 1fr;background:var(--superficie-2);border-radius:var(--radio-s);padding:4px;gap:4px}
.seg button{background:none;border:0;padding:9px;border-radius:7px;color:var(--texto-suave);cursor:pointer;font-weight:500;transition:background .2s,color .2s}
.seg button.activa{background:var(--superficie);color:var(--texto);font-weight:600;box-shadow:var(--sombra)}

/* ===================== Tablas ===================== */
.tabla-wrap{overflow-x:auto;border:1px solid var(--borde);border-radius:var(--radio);background:var(--superficie);box-shadow:var(--sombra)}
.tabla{width:100%;border-collapse:collapse;min-width:620px}
.tabla th,.tabla td{padding:11px 14px;text-align:left;border-bottom:1px solid var(--borde);vertical-align:top;font-size:.92rem}
.tabla th{font-size:.74rem;text-transform:uppercase;letter-spacing:.06em;color:var(--texto-suave);background:var(--superficie-2);font-weight:600}
.tabla tbody tr{transition:background .15s}
.tabla tbody tr:hover{background:var(--superficie-2)}
.tabla tr:last-child td{border-bottom:0}

/* ===================== Tarjetas ===================== */
.tarjetas{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(260px,100%),1fr));gap:14px}
.tarjetas > *{min-width:0}
.tarjeta{background:var(--superficie);border:1px solid var(--borde);border-radius:var(--radio);padding:18px;display:flex;flex-direction:column;gap:10px;box-shadow:var(--sombra);transition:transform .25s cubic-bezier(.2,.7,.2,1),box-shadow .25s,border-color .25s;min-width:0}
.tarjeta:hover{transform:translateY(-2px);box-shadow:var(--sombra-alta);border-color:var(--texto-suave)}
.tarjeta h3{margin:0;font-size:1rem;font-weight:600;overflow-wrap:anywhere}
.cab-tarjeta{display:flex;justify-content:space-between;gap:8px;align-items:flex-start;flex-wrap:wrap}
.etiqueta{font-size:.72rem;text-transform:uppercase;letter-spacing:.06em;color:var(--texto-suave);font-weight:600}
.frase{background:var(--superficie-2);border-radius:var(--radio-s);padding:10px 12px;font-size:.92rem;overflow-wrap:anywhere}
.nota{color:var(--texto-suave);font-size:.9rem}
.progreso{height:6px;border-radius:999px;background:var(--superficie-2);overflow:hidden}
.progreso span{display:block;height:100%;width:100%;background:var(--acento);border-radius:inherit;transform-origin:left center;transform:scaleX(var(--p,0));animation:crece .9s cubic-bezier(.2,.7,.2,1) .15s backwards}
.tarjeta-ind{flex-direction:row;align-items:center;flex-wrap:wrap;gap:20px}
.texto-ind{flex:1 1 200px;min-width:0;display:flex;flex-direction:column;gap:8px}

/* ===================== Panel (dashboard) ===================== */
.kpis{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.kpis > *{min-width:0}
.kpis > :last-child:nth-child(odd){grid-column:1/-1}
@media (min-width:1000px){.kpis{grid-template-columns:repeat(5,minmax(0,1fr))}.kpis > :last-child:nth-child(odd){grid-column:auto}}
.kpi{background:var(--superficie);border:1px solid var(--borde);border-radius:var(--radio);padding:16px;display:flex;flex-direction:column;gap:4px;box-shadow:var(--sombra);transition:transform .25s cubic-bezier(.2,.7,.2,1),box-shadow .25s;min-width:0}
.kpi:hover{transform:translateY(-2px);box-shadow:var(--sombra-alta)}
.kpi-cab{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.kpi-etq{font-size:.78rem;color:var(--texto-suave);font-weight:600;text-transform:uppercase;letter-spacing:.05em}
.kpi-ico{width:32px;height:32px;border-radius:9px;display:grid;place-items:center;background:var(--acento-suave);color:var(--acento);flex:0 0 auto}
.kpi-ico.alerta{background:var(--alerta-suave);color:var(--alerta)}
.kpi-ico.ok{background:var(--ok-suave);color:var(--ok)}
.kpi-num{font-size:clamp(1.7rem,1.4rem + 1vw,2.3rem);font-weight:700;letter-spacing:-.02em;line-height:1.1;color:var(--texto);font-variant-numeric:tabular-nums;margin-top:6px}
.dash{display:grid;gap:14px;grid-template-columns:minmax(0,1fr)}
.dash > *{min-width:0}
@media (min-width:760px){.dash-2{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (min-width:1000px){.dash-3{grid-template-columns:repeat(3,minmax(0,1fr))}}
.anillo-wrap{position:relative;width:min(190px,70%);aspect-ratio:1;flex:0 0 auto;max-width:100%}
.anillo{width:100%;height:100%;transform:rotate(-90deg);display:block;overflow:visible}
.anillo-pista{fill:none;stroke:var(--superficie-2);stroke-width:12}
.anillo-val{fill:none;stroke:var(--acento);stroke-width:12;stroke-linecap:round;stroke-dasharray:100;animation:anillo 1.2s cubic-bezier(.2,.7,.2,1) .1s backwards}
.anillo.vacio .anillo-pista{stroke:var(--borde);stroke-dasharray:3 5}
.anillo-txt{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:14px}
.anillo-num{font-size:1.9rem;font-weight:700;letter-spacing:-.02em;font-variant-numeric:tabular-nums;line-height:1.1}
.anillo-num small{font-size:.9rem;font-weight:600;color:var(--texto-suave)}
.anillo-etq{font-size:.8rem;color:var(--texto-suave);font-weight:500}
.sin-pct{font-size:1rem;font-weight:700;color:var(--alerta)}
.anillo-txt .sin-pct{font-size:.9rem;line-height:1.25;max-width:78%;text-wrap:balance}
.motivo{background:var(--alerta-suave);color:var(--alerta);border-radius:var(--radio-s);padding:10px 12px;font-size:.9rem;font-weight:500}
.barras{list-style:none;padding:0;margin:0;display:grid;gap:12px}
.barra{display:flex;flex-direction:column;gap:6px;border-radius:6px;cursor:default}
.barra:focus-visible{outline-offset:4px}
.barra-cab{display:flex;justify-content:space-between;gap:10px;font-size:.88rem}
.barra-etq{overflow-wrap:anywhere;min-width:0}
.barra-val{font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.barra-pista{height:10px;border-radius:999px;background:var(--superficie-2);overflow:hidden}
.barra-fill{display:block;height:100%;width:100%;background:var(--grafico);border-radius:999px;transform-origin:left center;transform:scaleX(var(--p,0));animation:crece .9s cubic-bezier(.2,.7,.2,1) backwards}
/* Colores de estado de validación: paleta validada (verde/ámbar/azul), siempre con texto */
.f-pendiente{background:var(--est-alerta) !important}
.f-validada{background:var(--est-ok) !important}
.f-rechazada{background:var(--est-rechazo) !important}
.apilado{display:flex;gap:2px;height:14px;border-radius:999px;overflow:hidden;background:var(--superficie-2)}
.apilado span{display:block;height:100%;transform-origin:left center;animation:crece .9s cubic-bezier(.2,.7,.2,1) backwards}
.leyenda{list-style:none;padding:0;margin:10px 0 0;display:grid;gap:6px;font-size:.88rem}
.leyenda li{display:flex;align-items:center;gap:8px}
.punto{width:10px;height:10px;border-radius:3px;flex:0 0 auto}
.alertas{list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:8px}
.alertas li{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border-radius:var(--radio-s);background:var(--superficie-2);min-width:0}
.alertas li > div{min-width:0;display:flex;flex-direction:column;gap:2px}
.alertas li strong{overflow-wrap:anywhere}
.linea-tiempo{list-style:none;padding:0;margin:0;display:flex;flex-direction:column;position:relative}
.linea-tiempo li{display:grid;grid-template-columns:14px minmax(0,1fr);gap:12px;position:relative;padding-bottom:14px}
.linea-tiempo li:last-child{padding-bottom:0}
.linea-tiempo li::before{content:"";position:absolute;left:6px;top:14px;bottom:0;width:2px;background:var(--borde)}
.linea-tiempo li:last-child::before{display:none}
.tl-punto{width:14px;height:14px;border-radius:50%;background:var(--superficie);border:3px solid var(--acento);margin-top:3px;position:relative;z-index:1}
.linea-tiempo .cuerpo{display:flex;flex-direction:column;gap:3px;min-width:0}
.linea-tiempo .cuerpo strong{overflow-wrap:anywhere}
.nota-pie{font-size:.82rem;color:var(--texto-suave)}

/* ===================== Autenticación ===================== */
.auth{min-height:100vh;min-height:100dvh;display:flex;align-items:center;justify-content:center;padding-top:24px;padding-bottom:24px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));background:radial-gradient(1200px 500px at 50% -10%,var(--acento-suave),transparent 70%)}
.auth-caja{width:100%;max-width:400px;background:var(--superficie);border:1px solid var(--borde);border-radius:18px;padding:26px;display:flex;flex-direction:column;gap:16px;box-shadow:var(--sombra-alta);animation:sube .5s cubic-bezier(.2,.7,.2,1) backwards}
.auth-caja h1{font-size:1.25rem}
.auth-marca{display:flex;align-items:center;gap:10px}

/* ===================== Modal y avisos ===================== */
.modal{position:fixed;inset:0;background:rgba(8,14,24,.5);display:flex;align-items:flex-start;justify-content:center;padding:28px 12px;overflow:auto;z-index:50;backdrop-filter:blur(2px)}
.modal:not([hidden]){animation:fundido .2s ease-out}
.modal-caja{background:var(--superficie);border:1px solid var(--borde);border-radius:16px;width:100%;max-width:780px;padding:20px;color:var(--texto);box-shadow:var(--sombra-alta);min-width:0}
.modal:not([hidden]) .modal-caja{animation:subir-modal .28s cubic-bezier(.2,.7,.2,1) backwards}
.modal-cab{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:14px}
.modal-cab h2{margin:0;font-size:1.1rem}
.toast{position:fixed;left:50%;bottom:calc(16px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--texto);color:var(--fondo);padding:11px 18px;border-radius:12px;z-index:60;max-width:calc(100% - 32px);font-size:.92rem;font-weight:500;box-shadow:0 10px 30px -10px rgba(0,0,0,.4)}

function normCab(s) {

function contarFueraDeComillas(linea, sep) {
  let comillas = false, n = 0;

    else if (!comillas && c === sep) n++;

function detectarSeparador(texto) {
  const primera = String(texto || '').replace(/^﻿/, '').split(/\r\n|\n|\r/).find((l) => l.trim() !== '') || '';
  let mejor = ',', max = 0;
  for (const s of ['\t', ';', ',']) {
    const n = contarFueraDeComillas(primera, s);
    if (n > max) { max = n; mejor = s; }

}

// Devuelve registros con su número de fila de Excel (la cabecera es la fila 1). Omite filas vacías.
function parsearCSV(texto) {
  const t = String(texto || '').replace(/^﻿/, '');
  const sep = detectarSeparador(t);

  let celdas = [], campo = '', comillas = false, n = 1;
  const cerrarRegistro = () => {

    celdas = []; campo = ''; n++;
  };
  for (let i = 0; i < t.length; i++) {
    const c = t[i];
    if (comillas) {
      if (c === '"') {
        if (t[i + 1] === '"') { campo += '"'; i++; }
        else comillas = false;
      } else campo += c;
    } else if (c === '"' && campo === '') {
      comillas = true;
    } else if (c === sep) {

      if (c === '\r' && t[i + 1] === '\n') i++;
      cerrarRegistro();
    } else campo += c;
  }

  return { sep: sep, registros: registros.filter((r) => r.celdas.some((x) => x.trim() !== '')) };
}

function tablaDesde(texto) {

// Acepta AAAA-MM-DD (con hora opcional) y DD/MM/AAAA. Devuelve AAAA-MM-DD, o null si está vacía; valida = false si no es una fecha real.
function convertirFecha(valor) {
  const t = String(valor ?? '').trim();
  if (!t) return { fecha: null, valida: true };
  const iso = /^(\d{4})-(\d{1,2})-(\d{1,2})(?:[ T].*)?$/.exec(t);
  const dmy = /^(\d{1,2})\/(\d{1,2})\/(\d{4})$/.exec(t);
  let y, m, d;
  if (iso) { y = +iso[1]; m = +iso[2]; d = +iso[3]; }
  else if (dmy) { d = +dmy[1]; m = +dmy[2]; y = +dmy[3]; }
  else return { fecha: null, valida: false };
  const dt = new Date(Date.UTC(y, m - 1, d));
  if (dt.getUTCFullYear() !== y || dt.getUTCMonth() !== m - 1 || dt.getUTCDate() !== d) return { fecha: null, valida: false };
  return { fecha: y + '-' + pad2(m) + '-' + pad2(d), valida: true };
}

function detectarMapa(cabeceras) {
  const cab = cabeceras.map(normCab);
  const usadas = new Set();
  const mapa = {};
  for (const [campo] of CAMPOS_IMP) {
    const candidatos = [campo, ...(SINONIMOS_IMP[campo] || [])].map(normCab);
    let idx = -1;
    for (const cand of candidatos) {
      const j = cab.findIndex((h, i) => h === cand && !usadas.has(i));
      if (j >= 0) { idx = j; break; }
    }
    if (idx >= 0) usadas.add(idx);
    mapa[campo] = idx;
  }

}

function construirFilas(tabla, mapa) {

    }
    const fecha = convertirFecha(v('fecha'));
    if (!fecha.valida) avisos.push({ fila: r.n, motivo: '«' + v('fecha') + '» no es una fecha válida (usa AAAA-MM-DD o DD/MM/AAAA): se guardará vacía.' });
    const enlaceTxt = v('enlace');
    const enlace = enlaceTxt ? urlSegura(enlaceTxt) : null;
    if (enlaceTxt && !enlace) avisos.push({ fila: r.n, motivo: 'Enlace no válido (debe empezar por http:// o https://): se guardará vacío.' });
    const metadatos = {};
    tabla.cabeceras.forEach((h, i) => {
      const val = String(c[i] ?? '').trim();
      if (!usadas.has(i) && val !== '') metadatos[h || 'columna_' + (i + 1)] = val;
    });
    validas.push({
      fila: r.n, identificador_origen: ident,
      corporacion: vacioANull(corp), jurisdiccion: vacioANull(v('jurisdiccion')), numero: vacioANull(num),
      fecha: fecha.fecha, enlace: enlace, url_origen: enlace,
      problema_juridico: vacioANull(v('problema_juridico')), hechos: vacioANull(v('hechos')), ratio: vacioANull(v('ratio')),
      obiter: vacioANull(v('obiter')), decisum: vacioANull(v('decisum')), texto_fuente: vacioANull(v('texto_fuente')),
      tendencia: normTendencia(v('tendencia')), metadatos: metadatos
    });
  }
  return { validas: validas, rechazos: rechazos, avisos: avisos };
}
function csvEscape(v) {
  const s = String(v ?? '');
  return /[",\r\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
}
async function sha256Hex(texto) {
  const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(String(texto)));
  return Array.from(new Uint8Array(buf), (b) => b.toString(16).padStart(2, '0')).join('');
}
// Hash del texto de la fuente; null si no hay texto o el navegador no ofrece crypto.subtle.
async function hashSeguro(texto) {
  if (!texto) return null;
  try { return await sha256Hex(texto); } catch (e) { return null; }
}
function imp0() {
  return { paso: 1, fuente: '', tema: '', texto: '', pegado: '', origen: '', archivo: '', formato: '',
    tabla: null, mapa: {}, prev: null, res: null, aviso: '', error: '' };
}

function msgError(err) {
  const m = (err && (err.message || err.msg || err.error_description)) || '';
  const mapa = [
    [/Invalid login credentials/i, 'Correo o contraseña incorrectos.'],
    [/Email not confirmed/i, 'Debes confirmar tu correo antes de ingresar.'],
    [/already registered|already been registered/i, 'Ya existe una cuenta con ese correo.'],
    [/at least 6 characters|Password should be/i, 'La contraseña debe tener al menos 6 caracteres.'],
    [/row-level security|permission denied|violates row-level/i, 'No tienes permiso para realizar esta acción.'],
    [/duplicate key/i, 'Ya existe un registro con esos datos.'],
    [/invalid email/i, 'El correo no es válido.'],
    [/rate limit|too many/i, 'Demasiados intentos. Espera un momento e inténtalo de nuevo.'],
    [/Failed to fetch|NetworkError|network/i, 'No hay conexión con el servidor. Revisa tu internet e inténtalo de nuevo.']
  ];
  for (const [re, txt] of mapa) if (re.test(m)) return txt;
  return 'Ocurrió un error' + (m ? ': ' + m : '. Inténtalo de nuevo.');
}

let toastT = null;
function toast(msg, error) {
  const t = $('#toast');
  t.textContent = msg;
  t.className = 'toast' + (error ? ' error' : '');
  // Reinicia la animación si ya había un aviso visible.
  t.hidden = true; void t.offsetWidth; t.hidden = false;
  clearTimeout(toastT);
  toastT = setTimeout(() => { t.hidden = true; }, 4200);
}

// Ejecuta una consulta de Supabase y lanza el error si lo hay.
async function q(promesa) {
  const { data, error } = await promesa;
  if (error) throw error;
  return data;
}
// Lectura tolerante: si falla, devuelve el valor de respaldo y (opcionalmente) avisa.
async function leer(builder, fallback, avisar) {
  try {
    const { data, error } = await builder;
    if (error) throw error;
    return data ?? fallback;
  } catch (e) {
    if (avisar !== false) toast(msgError(e), true);
    return fallback;
  }
}

async function copiarTexto(t) {
  try { await navigator.clipboard.writeText(t); return true; }
  catch (e) {
    const ta = document.createElement('textarea');
    ta.value = t; ta.style.position = 'fixed'; ta.style.opacity = '0';
    document.body.appendChild(ta); ta.select();
    let ok = false;
    try { ok = document.execCommand('copy'); } catch (err) { ok = false; }
    ta.remove();
    return ok;
  }
}

function reducirMovimiento() {
  return !!(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches);
}
// Cuenta de 0 al valor final en los elementos [data-contar]. El valor final ya está en el HTML.
function animarNumeros(raiz) {
  if (reducirMovimiento()) return;
  raiz.querySelectorAll('[data-contar]').forEach((el) => {
    const fin = Number(el.dataset.contar) || 0;
    const dec = Number(el.dataset.dec || 0);
    const fmt = (v) => v.toLocaleString('es', { minimumFractionDigits: dec, maximumFractionDigits: dec });
    const t0 = performance.now();
    const dur = 900;
    el.textContent = fmt(0);
    const paso = (t) => {
      const k = Math.min(1, (t - t0) / dur);
      const e = 1 - Math.pow(1 - k, 3);
      el.textContent = fmt(fin * e);
      if (k < 1) requestAnimationFrame(paso);
    };
    requestAnimationFrame(paso);
  });
}
// Escalona la entrada de tarjetas y KPI dentro de un contenedor recién pintado.
function escalonar(raiz) {
  if (!raiz) return;
  raiz.querySelectorAll('.tarjeta, .kpi').forEach((el, i) => {
    el.classList.add('sube');
    el.style.setProperty('--i', String(i));
  });
}

async function cargarPerfilPropio() {

  if (!p) {
    const nombre = (S.user.user_metadata && S.user.user_metadata.nombre) || (S.user.email || '').split('@')[0];
    p = await leer(sb.from('jr_perfiles').insert({ id: S.user.id, nombre: nombre, correo: S.user.email, rol: 'investigador' }).select().single(), null);
  }
  S.perfil = p || { id: S.user.id, nombre: S.user.email, correo: S.user.email, rol: 'investigador' };
}

async function cargarDatosBase() {
  const [fuentes, tematicas, lineas, config, perfiles] = await Promise.all([
    leer(sb.from('jr_fuentes').select('*').order('nombre'), S.fuentes),
    leer(sb.from('jr_tematicas').select('*').order('nombre'), S.tematicas),
    leer(sb.from('jr_lineas').select('*').order('titulo'), S.lineas),
    leer(sb.from('jr_config').select('*').eq('id', 1).maybeSingle(), S.config),
    leer(sb.from('jr_perfiles').select('*').order('nombre'), S.perfiles, false)
  ]);
  S.fuentes = fuentes || []; S.tematicas = tematicas || []; S.lineas = lineas || [];
  S.config = config; S.perfiles = perfiles || [];
}

async function cargarProvidencias() {
  // PostgREST devuelve como mucho 1000 filas por petición: se pide por rangos hasta agotar la tabla.
  const TAM = 1000;
  const todas = [];
  try {
    for (let desde = 0; ; desde += TAM) {
      const { data, error } = await sb.from('jr_providencias').select('*')
        .order('fecha', { ascending: false, nullsFirst: false }).order('id', { ascending: true })
        .range(desde, desde + TAM - 1);
      if (error) throw error;
      const bloque = data || [];
      todas.push(...bloque);
      if (bloque.length < TAM) break;
    }
  } catch (e) {
    toast(msgError(e), true);
  }
  S.providencias = todas;
  S.provCargadas = true;
}

async function enviarAuth(form) {

  const btn = $('#auth-btn');
  const msg = $('#auth-msg');

  btn.disabled = true;
  try {
    if (S.authModo === 'registro') {
      const nombre = String(fd.get('nombre') || '').trim();
      const { data, error } = await sb.auth.signUp({ email: correo, password: pass, options: { data: { nombre: nombre } } });
      if (error) throw error;
      if (data.user && Array.isArray(data.user.identities) && data.user.identities.length === 0) {
        throw new Error('User already registered');
      }
      if (!data.session) {
        msg.textContent = 'Cuenta creada. Revisa tu correo para confirmarla y luego ingresa.';
        msg.className = 'msg ok';
      }
    } else {
      const { error } = await sb.auth.signInWithPassword({ email: correo, password: pass });
      if (error) throw error;
    }
  } catch (e) {
    msg.textContent = msgError(e);
  } finally {
    btn.disabled = false;
  }

    .sort((a, b) => b.n - a.n);

  // Por tendencia
  const filasTend = TENDENCIAS.map(([k, t]) => ({
    etq: t, n: provs.filter((p) => (p.tendencia || 'sin_clasificar') === k).length, clase: ''

  }));

    .filter((x) => x.d <= DIAS_AVISO)
    .sort((a, b) => a.d - b.d);
  const alertasHtml = alertas.length
    ? `<ul class="alertas">${alertas.slice(0, 6).map(({ l, d }) => {
        const t = tematicaDe(l.tematica_id);
        const cuando = d < 0 ? `Vencida hace ${-d} ${-d === 1 ? 'día' : 'días'}`
          : d === 0 ? 'Vence hoy' : `Vence en ${d} ${d === 1 ? 'día' : 'días'}`;
        return `<li>
          ${ico(d < 0 ? 'alerta' : 'reloj', 18)}
          <div>
            <span class="badge ${d < 0 ? 'b-peligro' : 'b-alerta'}">${esc(cuando)}</span>
            <strong>${esc(l.titulo)}</strong>
            <span class="suave">${esc(t ? t.nombre : 'Sin temática')} · revisión ${fmtFecha(l.proxima_revision)}</span>
          </div>
        </li>`;
      }).join('')}</ul>
      ${alertas.length > 6 ? `<p class="nota-pie">Y ${alertas.length - 6} más. Revísalas en la pestaña Líneas.</p>` : ''}`
    : '<p class="vacio">No hay líneas con revisión vencida ni próxima a vencer.</p>';

  // Últimas 5 providencias (la lista ya viene ordenada por fecha, de más reciente a más antigua)
  const ultimas = provs.slice(0, 5);
  const ultimasHtml = ultimas.length
    ? `<ol class="linea-tiempo">${ultimas.map((p) => {
        const f = fuenteDe(p.fuente_id);
        return `<li>
          <span class="tl-punto" aria-hidden="true"></span>
          <div class="cuerpo">
            <span class="suave">${fmtFecha(p.fecha)}</span>
            <strong>${esc(p.corporacion || 'Sin corporación')}</strong>
            ${p.numero ? '<span class="suave">' + esc(p.numero) + '</span>' : ''}
            <div class="acciones">${badgeVal(estadoValDe(p))}<span class="suave">${esc(f ? f.nombre : 'Sin fuente')}</span></div>
          </div>
        </li>`;
      }).join('')}</ol>`
    : '<p class="vacio">Todavía no hay providencias registradas.</p>';

  return cab + `
    ${kpis}
    <div class="dash dash-2">
      ${tarjetaIndicador(ind)}
      <article class="tarjeta">
        <h2>Alertas de revisión</h2>
        <p class="suave">Líneas vencidas o con revisión dentro de ${DIAS_AVISO} días.</p>
        ${alertasHtml}
      </article>
    </div>
    <div class="dash dash-3">
      <article class="tarjeta">
        <h2>Providencias por fuente</h2>
        ${filasFuente.length ? htmlBarras(filasFuente) : '<p class="vacio">Sin datos.</p>'}
      </article>
      <article class="tarjeta">
        <h2>Providencias por tendencia</h2>
        ${htmlBarras(filasTend)}
      </article>
      <article class="tarjeta">
        <h2>Providencias por validación</h2>
        ${htmlApilado(filasVal)}
      </article>
    </div>
    <div class="dash dash-2">
      <article class="tarjeta">
        <h2>Líneas por estado</h2>
        ${S.lineas.length ? htmlBarras(filasLineas) : '<p class="vacio">No hay líneas creadas.</p>'}
      </article>
      <article class="tarjeta">
        <h2>Últimas 5 providencias</h2>
        <p class="suave">Ordenadas por fecha de la providencia.</p>
        ${ultimasHtml}
      </article>
    </div>
    <div class="dash dash-2">${tarjetaCalidad(provs)}${tarjetaCobertura()}</div>
  </section>`;
}

function temaSugerido(texto) {
  const n = norm(texto);
  if (!n) return null;
  return S.tematicas.find((t) => {
    const tn = norm(t.nombre);
    return tn && (n.includes(tn) || tn.includes(n));
  }) || null;
}

// Últimas 200 capturas (más reciente primero) y total de filas de jr_capturas.
async function cargarCapturas() {

async function guardarCaptura(form) {
  const fd = new FormData(form);
  const termino = vacioANull(fd.get('termino'));
  if (!termino) { toast('Escribe el término buscado.', true); return; }
  const conteoTxt = vacioANull(fd.get('conteo'));
  if (conteoTxt !== null && !/^\d+$/.test(conteoTxt)) {
    toast('El número de resultados debe ser un entero mayor o igual a 0.', true);
    return;
  }
  const urlTxt = vacioANull(fd.get('url_consulta'));
  let url = null;
  if (urlTxt) {
    url = urlSegura(urlTxt);
    if (!url) { toast('La URL de la consulta debe empezar por http:// o https://', true); return; }
  }
  await q(sb.from('jr_capturas').insert({
    fuente_id: vacioANull(fd.get('fuente_id')),
    tematica_id: vacioANull(fd.get('tematica_id')),
    termino: termino,
    url_consulta: url,
    conteo_resultados: conteoTxt === null ? null : Number(conteoTxt),
    metodo: 'asistido',
    nota: vacioANull(fd.get('nota'))
  }));
  cerrarModal();
  toast('Búsqueda registrada. Queda listada abajo.');
  await cargarCapturas();
  if (S.tab === 'buscador') renderBusqCapturas();
  else if (S.tab === 'panel') renderTab();
}

// Panel: última captura de cada fuente, a partir de las últimas 200 capturas.
// Calidad de la base: porcentaje de providencias con cada atributo clave.
function tarjetaCalidad(provs) {
  const total = provs.length;
  if (!total) return '<article class="tarjeta"><h2>Calidad de la base</h2><p class="vacio">Sin providencias para medir.</p></article>';
  const filas = [
    { etq: 'Con relevancia clasificada', n: provs.filter((p) => !!relevanciaDe(p)).length },
    { etq: 'Con enlace directo', n: provs.filter((p) => !!enlaceDe(p)).length },
    { etq: 'Con seguro de cumplimiento', n: provs.filter((p) => metaBool(p, 'seguro_cumplimiento')).length },
    { etq: 'Pendientes de validación', n: provs.filter((p) => estadoValDe(p) === 'pendiente').length }
  ];
  return `
  <article class="tarjeta">
    <h2>Calidad de la base</h2>
    <p class="suave">Porcentaje de las ${esc(total)} providencias que tienen cada atributo.</p>
    <ol class="barras">${filas.map((f) => {
      const pct = Math.round((f.n / total) * 1000) / 10;
      const txt = `${f.etq}: ${f.n} de ${total} (${fmtPct(pct)} %)`;
      return `<li class="barra" tabindex="0" title="${esc(txt)}" aria-label="${esc(txt)}">
        <div class="barra-cab"><span class="barra-etq">${esc(f.etq)}</span><span class="barra-val">${esc(f.n)} · ${esc(fmtPct(pct))} %</span></div>
        <div class="barra-pista"><span class="barra-fill" style="--p:${(f.n / total).toFixed(4)}"></span></div>
      </li>`;
    }).join('')}</ol>
  </article>`;
}

function tarjetaCobertura() {
  let cuerpo;
  if (!S.capturas.length) {
    cuerpo = '<p class="vacio">Todavía no hay capturas. Registra una búsqueda desde el Buscador o importa un lote y verás aquí la cobertura de cada fuente.</p>';
  } else if (!S.fuentes.length) {
    cuerpo = '<p class="vacio">No hay fuentes registradas.</p>';
  } else {
    const ultima = new Map();
    S.capturas.forEach((c) => { const k = String(c.fuente_id); if (!ultima.has(k)) ultima.set(k, c); });
    cuerpo = `<ul class="alertas">${S.fuentes.map((f) => {
      const c = ultima.get(String(f.id));
      const conteo = c && (c.conteo_resultados === null || c.conteo_resultados === undefined) ? '—' : (c ? c.conteo_resultados : '');
      return `<li><div><strong>${esc(f.nombre)}</strong>${c
        ? `<span class="suave">Última captura: ${fmtFecha(c.creado)} · ${esc(conteo)} resultados</span>`
        : '<span class="suave">Sin capturas en las últimas 200</span>'}</div></li>`;
    }).join('')}</ul>`;
  }
  return `
  <article class="tarjeta">
    <h2>Cobertura por fuente</h2>
    <p class="suave">Última captura de cada fuente, leída de las últimas 200 capturas.</p>
    ${cuerpo}
  </article>`;
}

/* ================= 1c. Importar lotes ================= */
const PASOS_IMP = [[1, 'Fuente y tema'], [2, 'Archivo o texto'], [3, 'Columnas'], [4, 'Vista previa']];

function msgImp(txt) { return `<p class="msg" role="alert">${esc(txt || '')}</p>`; }

async function cargarLotes() {
  S.lotes = (await leer(sb.from('jr_lotes').select('*').order('creado', { ascending: false }).limit(10), [])) || [];
}

function leerArchivo(file) {
  if (!file) return;
  if (file.size > 5 * 1024 * 1024) { S.imp.aviso = 'El archivo supera 5 MB. Divídelo en partes.'; renderTab(); return; }
  const lector = new FileReader();
  lector.onload = () => {
    const texto = String(lector.result || '');
    S.imp.texto = texto;
    S.imp.origen = 'archivo';
    S.imp.archivo = file.name;
    S.imp.aviso = texto.includes('�') ? 'El archivo no parece estar en UTF-8. En Excel, guárdalo como «CSV UTF-8» y vuelve a subirlo.' : '';
    renderTab();
  };
  lector.onerror = () => toast('No se pudo leer el archivo.', true);
  lector.readAsText(file, 'utf-8');
}

function importarTexto() {
  const I = S.imp;
  I.aviso = '';
  if (I.pegado.trim()) { I.texto = I.pegado; I.origen = 'pegado'; I.archivo = ''; }
  else if (!I.texto || !I.texto.trim()) { I.aviso = 'Sube un archivo o pega la tabla antes de continuar.'; renderTab(); return; }
  let tabla;
  try { tabla = tablaDesde(I.texto); }
  catch (e) { I.aviso = e.message; renderTab(); return; }
  const n = tabla.registros.length;
  if (n > LIMITE_FILAS) {
    I.aviso = `El archivo tiene ${n} filas de datos y el límite es ${LIMITE_FILAS} por archivo. Divídelo en partes y vuelve a importar.`;
    renderTab();
    return;
  }
  I.tabla = tabla;
  I.formato = tabla.sep === '\t' ? 'tsv' : 'csv';
  I.mapa = detectarMapa(tabla.cabeceras);
  I.prev = null;
  I.paso = 3;
  renderTab();
}

function mapearColumnas(form) {
  const I = S.imp;
  const fd = new FormData(form);
  const mapa = {};
  CAMPOS_IMP.forEach(([c]) => {
    const v = fd.get('m_' + c);
    mapa[c] = (v === null || v === '') ? -1 : Number(v);
  });
  if (mapa.identificador_origen < 0 && (mapa.corporacion < 0 || mapa.numero < 0)) {
    I.aviso = 'Asigna identificador de origen, o bien corporación y número, para poder identificar cada providencia.';
    renderTab();
    return;
  }
  I.mapa = mapa;
  I.aviso = '';
  I.paso = 4;
  I.prev = null;
  renderTab();
  prepararPrevia().catch((err) => {
    S.imp.paso = 3;
    S.imp.aviso = msgError(err);
    renderTab();
  });
}

// Identificadores ya presentes en la fuente. Consultas por tandas de 200; los valores con caracteres especiales van uno a uno.
async function existentesEnBD(fuenteId, ids) {
  const existentes = new Set();
  const unicos = [...new Set(ids)];
  const simples = unicos.filter((x) => !/[",()\\]/.test(x));
  const raros = unicos.filter((x) => /[",()\\]/.test(x));
  for (let i = 0; i < simples.length; i += 200) {
    const filas = await q(sb.from('jr_providencias').select('identificador_origen')
      .eq('fuente_id', fuenteId).in('identificador_origen', simples.slice(i, i + 200)));
    (filas || []).forEach((r) => existentes.add(r.identificador_origen));
  }
  for (const x of raros) {
    const filas = await q(sb.from('jr_providencias').select('identificador_origen').eq('fuente_id', fuenteId).eq('identificador_origen', x));
    (filas || []).forEach((r) => existentes.add(r.identificador_origen));
  }
  return existentes;
}

async function prepararPrevia() {
  const I = S.imp;
  const res = construirFilas(I.tabla, I.mapa);
  const ya = await existentesEnBD(I.fuente, res.validas.map((f) => f.identificador_origen));
  const vistos = new Set();
  const nuevas = [];
  let dupBD = 0, dupArchivo = 0;
  for (const f of res.validas) {
    if (vistos.has(f.identificador_origen)) { dupArchivo++; continue; }
    vistos.add(f.identificador_origen);
    if (ya.has(f.identificador_origen)) { dupBD++; continue; }
    nuevas.push(f);
  }
  I.prev = { res: res, nuevas: nuevas, dupBD: dupBD, dupArchivo: dupArchivo };
  if (S.tab === 'importar' && I.paso === 4) renderTab();
}

async function confirmarImportacion() {
  const I = S.imp;
  const P = I.prev;
  if (I.paso !== 4 || !P) return;
  if (!P.nuevas.length) { toast('No hay filas nuevas para importar.', true); return; }
  const nombre = I.origen === 'archivo' ? I.archivo : 'importación pegada';
  const total = I.tabla.registros.length;
  let carrera = 0, lote = null, insertadas = 0;
  const fallidas = [];
  I.paso = 5; I.res = null; I.error = '';
  renderTab();
  try {
    progresoImp(0, 'Creando el registro del lote…');
    lote = await q(sb.from('jr_lotes').insert({
      fuente_id: I.fuente, tematica_id: I.tema, nombre_archivo: nombre, formato: I.formato,
      filas_total: total, filas_nuevas: 0, filas_duplicadas: 0, nota: 'Importación en curso'
    }).select().single());
    const uid = S.user.id;
    const ahora = new Date().toISOString();
    const items = [];
    for (let i = 0; i < P.nuevas.length; i++) {
      const f = P.nuevas[i];
      items.push({ fila: f.fila, datos: {
        fuente_id: I.fuente, tematica_id: I.tema,
        identificador_origen: f.identificador_origen, corporacion: f.corporacion, jurisdiccion: f.jurisdiccion,
        numero: f.numero, fecha: f.fecha, url_origen: f.url_origen, enlace: f.enlace,
        problema_juridico: f.problema_juridico, hechos: f.hechos, ratio: f.ratio, obiter: f.obiter, decisum: f.decisum,
        texto_fuente: f.texto_fuente, texto_hash: await hashSeguro(f.texto_fuente), tendencia: f.tendencia,
        metadatos: f.metadatos, metodo_captura: 'lote', lote_id: lote.id, fecha_captura: ahora,
        creado_por: uid, analisis_ia: false, estado_validacion: 'pendiente'
      } });
      if (i % 50 === 0) progresoImp((i / P.nuevas.length) * 30, 'Preparando filas…');
    }
    // Sin upsert: índice único parcial. Se inserta por tandas de 100; si una tanda falla, se reintenta fila a fila.
    for (let i = 0; i < items.length; i += 100) {
      const tanda = items.slice(i, i + 100);
      const { error } = await sb.from('jr_providencias').insert(tanda.map((x) => x.datos));
      if (!error) insertadas += tanda.length;
      else {
        for (const x of tanda) {
          const r = await sb.from('jr_providencias').insert(x.datos);
          if (!r.error) insertadas++;
          else if (/duplicate key/i.test(r.error.message || '')) carrera++;
          else fallidas.push({ fila: x.fila, motivo: msgError(r.error) });
        }
      }
      progresoImp(30 + ((i + tanda.length) / items.length) * 70, `Guardando… ${Math.min(i + tanda.length, items.length)} de ${items.length}`);
    }
    const dup = P.dupBD + P.dupArchivo + carrera;
    const rechazos = P.res.rechazos;
    const nota = `Rechazadas por validación: ${rechazos.length}.` + (fallidas.length ? ` Fallidas al guardar: ${fallidas.length}.` : '');
    await q(sb.from('jr_lotes').update({ filas_nuevas: insertadas, filas_duplicadas: dup, nota: nota }).eq('id', lote.id));
    await q(sb.from('jr_capturas').insert({
      fuente_id: I.fuente, tematica_id: I.tema, termino: nombre, metodo: 'lote',
      conteo_resultados: total, lote_id: lote.id
    }));
    I.res = { lote: nombre, total: total, nuevas: insertadas, duplicadas: dup, rechazos: rechazos, fallidas: fallidas };
    progresoImp(100, 'Importación terminada.');
  } catch (e) {
    I.error = msgError(e);
    if (lote) {
      try { await sb.from('jr_lotes').update({ filas_nuevas: insertadas, nota: 'Importación interrumpida: ' + I.error }).eq('id', lote.id); }
      catch (x) { /* el lote queda con los datos parciales */ }
    }
    I.res = { lote: nombre, total: total, nuevas: insertadas, duplicadas: P.dupBD + P.dupArchivo + carrera, rechazos: P.res.rechazos, fallidas: fallidas };
  }
  I.paso = 6;
  await Promise.all([cargarLotes(), cargarCapturas()]);
  renderTab();
  if (I.error) toast(I.error, true);
  else toast(`Importación terminada: ${insertadas} filas nuevas.`);
}

function descargarPlantilla() {

/* ================= 2. Repositorio ================= */
/* REPO-PURO:INICIO (funciones puras del Repositorio: sin DOM ni red) */
const REL_TXT = { alta: 'Alta', media: 'Media', baja: 'Baja', sin: 'Sin clasificar' };
const ORDENES_REPO = [['fecha_desc', 'Fecha (más reciente)'], ['fecha_asc', 'Fecha (más antigua)'], ['corp_asc', 'Corporación (A–Z)'], ['corp_desc', 'Corporación (Z–A)']];
const TAM_PAGINA = 50;
const COLATOR_ES = new Intl.Collator('es', { sensitivity: 'base', numeric: true });
const CAB_CSV = ['fuente', 'corporacion', 'jurisdiccion', 'numero', 'fecha', 'identificador_origen', 'enlace',
  'relevancia', 'seguro_cumplimiento', 'estado_validacion', 'tendencia'];

// Valor de un metadato como texto: primitivos tal cual, objetos en JSON, nulos vacíos.
function valorMeta(v) {
  if (v === null || v === undefined) return '';
  return typeof v === 'object' ? JSON.stringify(v) : String(v);
}
// Metadato booleano (true o "true").
function metaBool(p, clave) {
  const v = p && p.metadatos ? p.metadatos[clave] : null;
  return v === true || v === 'true';
}
// Relevancia normalizada ('alta', 'media' o 'baja'), o null si no está clasificada.
function relevanciaDe(p) {
  const r = norm(p && p.metadatos ? p.metadatos.relevancia : '');
  return (r === 'alta' || r === 'media' || r === 'baja') ? r : null;
}
// Enlace directo válido (url_origen o enlace), o null.
function enlaceDe(p) {
  return urlSegura(p && p.url_origen) || urlSegura(p && p.enlace) || null;
}
// Texto sobre el que busca el filtro de texto: identificador, número, corporación, textos y metadatos (ponente, expediente...).
function textoBusquedaProv(p) {
  return norm([p.identificador_origen, p.numero, p.corporacion, p.jurisdiccion, p.problema_juridico, p.hechos,
    p.ratio, p.obiter, p.decisum, p.recomendacion, JSON.stringify(p.metadatos || {})].join(' '));
}
// Filtros del Repositorio. f = { tema, fuente, estado, texto, relevancia, seguro, metodo, lote }; cadena vacía = sin filtrar.
function filtrarProvidencias(lista, f) {
  const txt = norm(f.texto);
  return lista.filter((p) =>
    (!f.tema || String(p.tematica_id) === f.tema) &&
    (!f.fuente || String(p.fuente_id) === f.fuente) &&
    (!f.estado || p.estado_validacion === f.estado) &&
    (!f.relevancia || (f.relevancia === 'sin' ? !relevanciaDe(p) : relevanciaDe(p) === f.relevancia)) &&
    (!f.seguro || metaBool(p, 'seguro_cumplimiento')) &&
    (!f.metodo || p.metodo_captura === f.metodo) &&
    (!f.lote || String(p.lote_id) === f.lote) &&
    (!txt || textoBusquedaProv(p).includes(txt)));
}
// Ordena una copia. Las filas sin fecha o sin corporación van siempre al final.
function ordenarProvidencias(lista, orden) {
  const vacio = (v) => v === null || v === undefined || v === '';
  const porCampo = (campo, dir) => (a, b) => {
    const va = a[campo], vb = b[campo];
    if (vacio(va) && vacio(vb)) return 0;
    if (vacio(va)) return 1;
    if (vacio(vb)) return -1;
    let c;
    if (campo === 'fecha') c = String(va) < String(vb) ? -1 : (String(va) > String(vb) ? 1 : 0);
    else c = COLATOR_ES.compare(String(va), String(vb));
    return dir * c;
  };
  const reglas = {
    fecha_desc: porCampo('fecha', -1), fecha_asc: porCampo('fecha', 1),
    corp_asc: porCampo('corporacion', 1), corp_desc: porCampo('corporacion', -1)
  };
  return lista.slice().sort(reglas[orden] || reglas.fecha_desc);
}
// Divide en páginas. Devuelve la página pedida (acotada al rango válido) y el rango mostrado.
function paginar(lista, pagina, tam) {
  const total = lista.length;
  const paginas = Math.max(1, Math.ceil(total / tam));
  const n = Math.min(Math.max(1, Math.floor(Number(pagina)) || 1), paginas);
  const ini = (n - 1) * tam;
  return {
    items: lista.slice(ini, ini + tam), pagina: n, paginas: paginas, total: total,
    desde: total ? ini + 1 : 0, hasta: Math.min(ini + tam, total)
  };
}
// Evita la inyección de fórmulas: prefija con apóstrofo las celdas que empiezan por = + - @ tabulador o retorno.
function protegerFormula(v) {
  const s = (v === null || v === undefined) ? '' : String(v);
  return /^[=+\-@\t\r]/.test(s) ? "'" + s : s;
}
// CSV del Repositorio: BOM UTF-8, CRLF, comillas escapadas y protección de fórmulas. nombreFuente(id) da el nombre de la fuente.
function csvProvidencias(lista, nombreFuente) {
  const filas = lista.map((p) => {
    const seg = metaBool(p, 'seguro_cumplimiento') ? 'sí'
      : ((p.metadatos && p.metadatos.seguro_cumplimiento !== undefined && p.metadatos.seguro_cumplimiento !== null) ? 'no' : '');
    return [nombreFuente(p.fuente_id), p.corporacion, p.jurisdiccion, p.numero, p.fecha, p.identificador_origen,
      p.url_origen || p.enlace, relevanciaDe(p) || '', seg, p.estado_validacion, p.tendencia];
  });
  return '﻿' + [CAB_CSV].concat(filas).map((f) => f.map((v) => csvEscape(protegerFormula(v))).join(',')).join('\r\n') + '\r\n';
}
/* REPO-PURO:FIN */

// Chips de los filtros activos, cada uno con botón para quitarlo.
function chipsRepo(f) {
  const chips = [];
  const add = (clave, etiq, valor) => {
    const txt = valor === null ? etiq : etiq + ': ' + valor;
    chips.push(`<span class="chip chip-q">${esc(txt)}<button type="button" data-accion="quitar-filtro" data-filtro="${esc(clave)}" aria-label="Quitar filtro ${esc(txt)}">×</button></span>`);
  };
  if (f.tema) { const t = tematicaDe(f.tema); add('tema', 'Tema', t ? t.nombre : 'no disponible'); }
  if (f.fuente) { const x = fuenteDe(f.fuente); add('fuente', 'Fuente', x ? x.nombre : 'no disponible'); }
  if (f.estado) add('estado', 'Validación', ESTADO_VAL_TXT[f.estado] || f.estado);
  if (f.relevancia) add('relevancia', 'Relevancia', REL_TXT[f.relevancia] || f.relevancia);
  if (f.metodo) add('metodo', 'Método', METODO_TXT[f.metodo] || f.metodo);
  if (f.lote) add('lote', 'Lote', loteTxt(f.lote));
  if (f.seguro) add('seguro', 'Solo seguro de cumplimiento', null);
  if (f.texto) add('texto', 'Texto', '«' + f.texto + '»');
  if (!chips.length) return '';
  return `<div class="chips-f" aria-label="Filtros activos">${chips.join('')}<button type="button" class="btn sec pequeno" data-accion="limpiar-filtros">Limpiar filtros</button></div>`;

function sincronizarControlesRepo() {

  document.querySelectorAll('[data-filtro^="repo:"]').forEach((el) => {

}

function quitarFiltro(clave) {
  if (!FILTROS_REPO.includes(clave)) return;
  S.filtros.repo[clave] = '';
  S.filtros.repo.pagina = 1;
  clearTimeout(debRepo);
  sincronizarControlesRepo();
  renderRepoLista();
}

function limpiarFiltrosRepo() {
  FILTROS_REPO.forEach((k) => { S.filtros.repo[k] = ''; });

  clearTimeout(debRepo);
  sincronizarControlesRepo();

}

function cambiarPaginaRepo(dir) {
  S.filtros.repo.pagina += dir === 'sig' ? 1 : -1;

function renderRepoLista() {
  const el = $('#repo-lista');

  if (!S.provCargadas) {
    const esqueletos = '<div class="esqueleto" aria-hidden="true" style="min-height:56px;margin-top:12px"></div>'.repeat(4);
    el.innerHTML = esqueletos + '<p class="suave" role="status" style="margin-top:12px">Cargando providencias…</p>';

  }

function exportarRepo() {
  const f = S.filtros.repo;
  const lista = ordenarProvidencias(filtrarProvidencias(S.providencias, f), f.orden);
  if (!lista.length) { toast('No hay providencias que exportar con estos filtros.', true); return; }
  const contenido = csvProvidencias(lista, (id) => { const x = fuenteDe(id); return x ? x.nombre : ''; });
  const url = URL.createObjectURL(new Blob([contenido], { type: 'text/csv;charset=utf-8' }));
  const a = document.createElement('a');
  a.href = url;
  a.download = 'providencias-' + hoyISO() + '.csv';
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
  toast(`CSV exportado con ${lista.length} ${lista.length === 1 ? 'providencia' : 'providencias'}.`);
}

function filaProv(p) {

    if (p.estado_validacion !== 'rechazada') acc += ` <button class="btn sec pequeno peligro-txt" data-accion="validar" data-id="${id}" data-estado="rechazada">Marcar como rechazada</button>`;
  }
  const enl = enlaceDe(p);
  const rotulo = p.numero || p.identificador_origen || 'providencia';
  const accEnl = enl
    ? `<a class="enlace-ico" href="${esc(enl)}" target="_blank" rel="noopener noreferrer" title="Abrir fuente (se abre en otra pestaña)" aria-label="Abrir enlace de ${esc(rotulo)} (se abre en otra pestaña)">${ico('enlace', 15)}</a>`

  const secundario = [ponente ? 'Ponente: ' + ponente : '', expediente ? 'Expediente: ' + expediente : ''].filter(Boolean);

async function guardarProv(form) {
  const fd = new FormData(form);
  const id = fd.get('id');
  const tematica_id = vacioANull(fd.get('tematica_id'));
  if (!tematica_id) { toast('Selecciona una temática.', true); return; }
  const enlace = vacioANull(fd.get('enlace'));
  if (enlace && !urlSegura(enlace)) { toast('El enlace debe empezar por http:// o https://', true); return; }
  const cuerpo = { tematica_id: tematica_id, fuente_id: vacioANull(fd.get('fuente_id')) };
  for (const k of TEXTOS_PROV) cuerpo[k] = vacioANull(fd.get(k));
  cuerpo.tendencia = vacioANull(fd.get('tendencia')) || 'sin_clasificar';
  cuerpo.analisis_ia = fd.get('analisis_ia') === 'on';
  // Campos de captura: se conservan al editar; el hash del texto se recalcula en cada guardado.
  cuerpo.identificador_origen = vacioANull(fd.get('identificador_origen'));
  cuerpo.url_origen = enlace;
  cuerpo.texto_hash = await hashSeguro(cuerpo.texto_fuente);
  if (id) {
    await q(sb.from('jr_providencias').update(cuerpo).eq('id', id));
    toast('Providencia actualizada.');
  } else {
    cuerpo.creado_por = S.user.id;
    cuerpo.estado_validacion = 'pendiente';
    await q(sb.from('jr_providencias').insert(cuerpo));
    toast('Providencia registrada. Queda pendiente de validación humana.');
  }
  cerrarModal();
  await cargarProvidencias();
  if (S.tab === 'repositorio' || S.tab === 'panel') renderTab();
}

async function validarProv(id, estado) {
  await q(sb.from('jr_providencias').update({
    estado_validacion: estado,
    validada_por: S.user.id,
    validada_en: new Date().toISOString()
  }).eq('id', id));
  await cargarProvidencias();
  renderTab();
  toast(estado === 'validada' ? 'Providencia marcada como validada.' : 'Providencia marcada como rechazada.');
}

function vistaAnalisis() {

    </label>
    <div class="acciones"><button class="btn" data-accion="copiar-prompt">Copiar prompt</button></div>
    <h2>Respuesta en JSON</h2>
    <label>JSON devuelto
      <textarea id="an-json" rows="10" placeholder="Pega aquí el JSON devuelto por el asistente…"></textarea>
    </label>
    <div class="acciones"><button class="btn" data-accion="cargar-analisis">Cargar al formulario</button></div>
  </section>`;
}

function construirPrompt(texto) {
  return [
    'Eres un analista jurídico. A partir de la sentencia que aparece al final, extrae los siguientes campos y devuélvelos únicamente como un objeto JSON válido, sin texto adicional.',
    '',
    'Campos (todos son texto, salvo que se indique otra cosa):',
    '- "problema_juridico": pregunta jurídica que resuelve la providencia.',
    '- "hechos": hechos relevantes que el tribunal considera probados.',
    '- "ratio": razón central de la decisión (regla o subregla que sustenta el decisum).',
    '- "obiter": consideraciones adicionales que no son necesarias para la decisión.',
    '- "decisum": resolución concreta (qué se decide u ordena).',
    '- "tendencia": uno de estos valores exactos: "consolida", "modifica", "tension" o "sin_clasificar".',
    '- "riesgo": riesgo para la compañía que se deriva de la providencia, en una o dos frases.',
    '- "recomendacion": acción sugerida para la línea jurisprudencial, en una o dos frases.',
    '',
    'Reglas:',
    '1. Al final de cada campo cita el párrafo de origen entre corchetes, por ejemplo: [párrafo 12]. Si un dato no aparece en el texto, escribe "No consta en la providencia".',
    '2. No inventes datos, fechas, números de radicado, citas ni doctrina que no estén en el texto.',
    '3. Si el texto no permite determinar la tendencia, usa "sin_clasificar".',
    '4. Devuelve solo el JSON, con las claves exactamente como aparecen arriba.',
    '',
    'Sentencia:',
    '"""',
    texto,
    '"""'
  ].join('\n');
}

function extraerJSON(txt) {
  const t = txt.trim().replace(/^```(?:json)?/i, '').replace(/```$/, '').trim();
  const i = t.indexOf('{');
  const j = t.lastIndexOf('}');
  if (i < 0 || j < i) throw new Error('sin-json');
  return JSON.parse(t.slice(i, j + 1));
}

function cargarAnalisis() {
  const txtJson = $('#an-json').value;
  const texto = $('#an-texto').value.trim();
  if (!txtJson.trim()) { toast('Pega primero el JSON devuelto.', true); return; }
  let obj;
  try { obj = extraerJSON(txtJson); }
  catch (e) { toast('No se pudo leer el JSON. Revisa que esté completo y sin texto adicional.', true); return; }
  const val = (k) => {
    let x = obj[k];
    if (x && typeof x === 'object') x = x.valor !== undefined ? x.valor : JSON.stringify(x);
    if (Array.isArray(x)) x = x.join('\n');
    return x === null || x === undefined ? '' : String(x);
  };
  const tend = norm(val('tendencia')).replace(/\s+/g, '_');
  const prefill = {
    problema_juridico: val('problema_juridico'), hechos: val('hechos'), ratio: val('ratio'),
    obiter: val('obiter'), decisum: val('decisum'), riesgo: val('riesgo'), recomendacion: val('recomendacion'),
    tendencia: TENDENCIAS.some((t) => t[0] === tend) ? tend : 'sin_clasificar',
    texto_fuente: texto, analisis_ia: true
  };
  irA('repositorio').then(() => abrirFormProv(null, { prefill: prefill }));
}

async function crearLinea(form) {
  const fd = new FormData(form);
  const tematica_id = vacioANull(fd.get('tematica_id'));
  const titulo = vacioANull(fd.get('titulo'));
  if (!tematica_id || !titulo) { toast('Completa la temática y el título.', true); return; }
  const criterios = {};
  CRITERIOS.forEach(([k]) => { criterios[k] = false; });
  const nueva = await q(sb.from('jr_lineas').insert({
    tematica_id: tematica_id, titulo: titulo, version: '1', estado: 'borrador',
    criterios: criterios, responsable: null, proxima_revision: null
  }).select().single());
  cerrarModal();
  await cargarDatosBase();
  renderTab();
  toast('Línea creada.');
  abrirFicha(nueva);
}

function abrirFicha(l) {
  const puede = esValidador();
  const c = l.criterios || {};
  const n = criteriosOk(l);
  const opcionesEstado = ESTADOS_LINEA.map((e) => {
    const bloq = !puede && (e === 'aprobada' || e === 'vigente');
    return `<option value="${e}" ${e === l.estado ? 'selected' : ''} ${bloq ? 'disabled' : ''}>${esc(ESTADOS_LINEA_TXT[e])}</option>`;
  }).join('');
  abrirModal('Ficha de la línea', `
  <form id="form-ficha" class="formulario">
    <input type="hidden" name="id" value="${esc(l.id)}">
    <div class="grid2">
      <label class="ancho">Título<input name="titulo" required maxlength="200" value="${esc(l.titulo || '')}"></label>
      <label>Versión<input name="version" value="${esc(l.version || '')}"></label>
      <label>Estado<select name="estado">${opcionesEstado}</select></label>
      <label>Responsable<input name="responsable" value="${esc(l.responsable || '')}"></label>
      <label>Próxima revisión<input type="date" name="proxima_revision" value="${esc(l.proxima_revision || '')}"></label>
    </div>
    <fieldset>
      <legend>Criterios de completitud (${n} de ${CRITERIOS.length})</legend>
      ${CRITERIOS.map(([k, t]) => `<label class="check"><input type="checkbox" name="c_${k}" ${c[k] === true ? 'checked' : ''}> ${esc(t)}</label>`).join('')}
    </fieldset>
    ${puede ? '' : '<p class="aviso">Solo un validador o administrador puede pasar la línea a Aprobada o Vigente.</p>'}
    <div class="acciones dcha">
      <button type="button" class="btn sec" data-accion="cerrar-modal">Cancelar</button>
      <button class="btn" type="submit">Guardar ficha</button>
    </div>
  </form>`);
}

async function guardarFicha(form) {
  const fd = new FormData(form);
  const id = fd.get('id');
  const l = S.lineas.find((x) => String(x.id) === String(id)) || {};
  const puede = esValidador();
  const titulo = vacioANull(fd.get('titulo'));
  if (!titulo) { toast('El título es obligatorio.', true); return; }
  const estado = fd.get('estado');
  if (!puede && (estado === 'aprobada' || estado === 'vigente') && estado !== l.estado) {
    toast('Solo un validador o administrador puede aprobar o marcar como vigente una línea.', true);
    return;
  }
  const criterios = Object.assign({}, l.criterios || {});
  CRITERIOS.forEach(([k]) => { criterios[k] = fd.get('c_' + k) === 'on'; });
  const cambios = {
    titulo: titulo,
    version: vacioANull(fd.get('version')),
    responsable: vacioANull(fd.get('responsable')),
    proxima_revision: vacioANull(fd.get('proxima_revision')),
    criterios: criterios
  };
  if (puede || estado !== l.estado) cambios.estado = estado;
  await q(sb.from('jr_lineas').update(cambios).eq('id', id));
  cerrarModal();
  toast('Ficha guardada.');
  await cargarDatosBase();
  renderTab();
}

/* ================= 5. Indicador ================= */
function vistaIndicador() {
  const c = S.config || {};
  const hoy = hoyISO();
  const ind = calcIndicador(hoy);
  const prio = ind.prio;

  const admin = esAdmin() ? `
    <article class="bloque">
      <h2>Aprobaciones (administrador)</h2>
      <label class="check"><input type="checkbox" data-config="denominador_aprobado" ${c.denominador_aprobado === true ? 'checked' : ''}> Denominador aprobado (temáticas priorizadas)</label>
      <label class="check"><input type="checkbox" data-config="regla_completitud_aprobada" ${c.regla_completitud_aprobada === true ? 'checked' : ''}> Regla de completitud aprobada</label>
    </article>` : '';

  return `
  <section class="panel">
    <h1>Indicador de completitud</h1>
    ${tarjetaIndicador(ind)}
    ${admin}
    <p class="nota-fija">Nota fija: reuniones, borradores y matrices no cuentan como líneas.</p>
    <h2>Temáticas priorizadas</h2>
    <div class="tabla-wrap">
      <table class="tabla">
        <thead><tr><th>Temática</th><th>Área</th><th>Línea</th><th>Estado</th><th>Criterios</th><th>Próxima revisión</th><th>Cuenta</th></tr></thead>
        <tbody>${filasIndicador(prio, hoy)}</tbody>
      </table>
    </div>
  </section>`;
}

function filasIndicador(prio, hoy) {
  if (!prio.length) return '<tr><td colspan="7" class="vacio">No hay temáticas priorizadas.</td></tr>';
  return prio.map((t) => {
    const ls = S.lineas.filter((l) => String(l.tematica_id) === String(t.id));
    if (!ls.length) {
      return `<tr><td>${esc(t.nombre)}</td><td>${esc(t.area || '—')}</td><td colspan="5" class="suave">Sin línea creada</td></tr>`;
    }
    return ls.map((l) => `
      <tr>
        <td>${esc(t.nombre)}</td>
        <td>${esc(t.area || '—')}</td>
        <td>${esc(l.titulo)}</td>
        <td>${badgeLinea(l.estado)}</td>
        <td class="num">${criteriosOk(l)} de ${CRITERIOS.length}</td>
        <td>${fmtFecha(l.proxima_revision)}</td>
        <td>${cumpleLinea(l, hoy) ? '<span class="badge b-ok">Sí</span>' : '<span class="badge">No</span>'}</td>
      </tr>`).join('');
  }).join('');
}

async function guardarConfig(campo, valor) {
  const { data, error } = await sb.from('jr_config').update({ [campo]: valor }).eq('id', 1).select();
  if (error) throw error;
  if (!data || !data.length) throw new Error('No existe la fila de configuración jr_config con id = 1.');
  await cargarDatosBase();
  renderTab();
  toast('Configuración actualizada.');
}

/* ================= 6. Mi cuenta ================= */
function vistaCuenta() {
  const p = S.perfil || {};
  let admin = '';
  if (esAdmin()) {
    admin = `
    <h2 style="margin-top:6px">Gestión de temáticas</h2>
    <form id="form-tematica" class="bloque">
      <div class="grid2">
        <label>Nombre<input name="nombre" required maxlength="200"></label>
        <label>Área<select name="area">${opciones(AREAS.map((a) => [a, a]), 'Salud')}</select></label>
      </div>
      <label class="check"><input type="checkbox" name="priorizada"> Priorizada</label>
      <div class="acciones dcha"><button class="btn" type="submit">Crear temática</button></div>
    </form>
    <div class="tabla-wrap">
      <table class="tabla">
        <thead><tr><th>Temática</th><th>Área</th><th>Priorizada</th><th>Creada por</th></tr></thead>
        <tbody>${S.tematicas.length ? S.tematicas.map((t) => `
          <tr>
            <td>${esc(t.nombre)}</td>
            <td>${esc(t.area || '—')}</td>
            <td>${t.priorizada ? '<span class="badge b-ok">Sí</span>' : '<span class="badge">No</span>'}
              <button class="btn sec pequeno" data-accion="toggle-prio" data-id="${esc(t.id)}">${t.priorizada ? 'Quitar prioridad' : 'Priorizar'}</button></td>
            <td>${esc(nombreDe(t.creado_por))}</td>
          </tr>`).join('') : '<tr><td colspan="4" class="vacio">Sin temáticas.</td></tr>'}
        </tbody>
      </table>
    </div>
    <h2>Roles de usuarios</h2>
    <div class="tabla-wrap">
      <table class="tabla">
        <thead><tr><th>Nombre</th><th>Correo</th><th>Rol</th><th></th></tr></thead>
        <tbody>${S.perfiles.length ? S.perfiles.map((u) => `
          <tr>
            <td>${esc(u.nombre || '—')}</td>
            <td>${esc(u.correo || '—')}</td>
            <td><select data-rol-select data-id="${esc(u.id)}">${opciones(ROLES, u.rol || 'investigador')}</select></td>
            <td><button class="btn sec pequeno" data-accion="guardar-rol" data-id="${esc(u.id)}">Guardar rol</button></td>
          </tr>`).join('') : '<tr><td colspan="4" class="vacio">No se pudieron cargar los usuarios.</td></tr>'}
        </tbody>
      </table>
    </div>`;
  }
  return `
  <section class="panel">
    <h1>Mi cuenta</h1>
    <div class="bloque">
      <p><strong>Nombre:</strong> ${esc(p.nombre || '—')}</p>
      <p><strong>Correo:</strong> ${esc(p.correo || (S.user && S.user.email) || '—')}</p>
      <p><strong>Rol:</strong> ${esc(rolTxt(p.rol))}</p>
    </div>
    <div class="grid-cuenta">
      <form id="form-nombre" class="bloque">
        <h2>Cambiar nombre</h2>
        <label>Nombre<input name="nombre" required maxlength="120" value="${esc(p.nombre || '')}"></label>
        <div class="acciones dcha"><button class="btn" type="submit">Guardar nombre</button></div>
      </form>
      <form id="form-pass" class="bloque">
        <h2>Cambiar contraseña</h2>
        <label>Nueva contraseña<input type="password" name="p1" minlength="6" required autocomplete="new-password"></label>
        <label>Repetir contraseña<input type="password" name="p2" minlength="6" required autocomplete="new-password"></label>
        <div class="acciones dcha"><button class="btn" type="submit">Cambiar contraseña</button></div>
      </form>
    </div>
    ${admin}
  </section>`;
}

async function guardarNombre(form) {
  const nombre = vacioANull(new FormData(form).get('nombre'));
  if (!nombre) { toast('El nombre no puede estar vacío.', true); return; }
  await q(sb.from('jr_perfiles').update({ nombre: nombre }).eq('id', S.user.id));
  await q(sb.auth.updateUser({ data: { nombre: nombre } }));
  S.perfil = Object.assign({}, S.perfil, { nombre: nombre });
  await cargarDatosBase();
  renderShell();
  toast('Nombre actualizado.');
}

async function cambiarPass(form) {
  const fd = new FormData(form);
  const p1 = String(fd.get('p1') || '');
  const p2 = String(fd.get('p2') || '');
  if (p1.length < 6) { toast('La contraseña debe tener al menos 6 caracteres.', true); return; }
  if (p1 !== p2) { toast('Las contraseñas no coinciden.', true); return; }
  await q(sb.auth.updateUser({ password: p1 }));
  form.reset();
  toast('Contraseña actualizada.');
}

async function crearTematica(form) {
  const fd = new FormData(form);
  const nombre = vacioANull(fd.get('nombre'));
  if (!nombre) { toast('El nombre es obligatorio.', true); return; }
  await q(sb.from('jr_tematicas').insert({
    nombre: nombre,
    area: fd.get('area') || null,
    priorizada: fd.get('priorizada') === 'on',
    creado_por: S.user.id
  }));
  toast('Temática creada.');
  await cargarDatosBase();
  renderTab();
}

async function togglePrio(id) {
  const t = S.tematicas.find((x) => String(x.id) === String(id));
  if (!t) return;
  await q(sb.from('jr_tematicas').update({ priorizada: !t.priorizada }).eq('id', id));
  await cargarDatosBase();
  renderTab();
}

async function guardarRol(id) {
  const sel = Array.from(document.querySelectorAll('select[data-rol-select]')).find((s) => s.dataset.id === String(id));
  if (!sel) return;
  const rol = sel.value;
  if (String(id) === String(S.user.id) && rol !== 'admin' &&
      !confirm('Vas a quitarte el rol de administrador. ¿Deseas continuar?')) return;
  await q(sb.from('jr_perfiles').update({ rol: rol }).eq('id', id));
  await cargarDatosBase();
  if (String(id) === String(S.user.id)) S.perfil = Object.assign({}, S.perfil, { rol: rol });
  renderShell();
  toast('Rol actualizado.');
}

/* ================= Eventos ================= */
document.addEventListener('click', async (e) => {
  const el = e.target.closest('[data-accion]');
  if (!el) return;
  const a = el.dataset.accion;
  const id = el.dataset.id;
  try {
    switch (a) {
      case 'auth-modo': S.authModo = el.dataset.modo; renderAuth(); break;
      case 'salir': await cerrarSesion(); break;
      case 'tab': await irA(el.dataset.tab); break;
      case 'abrir-fuente': {
        const f = fuenteDe(id);
        const u = f ? urlSegura(f.url) : null;
        if (!u) toast('Esta fuente no tiene un enlace válido.', true);
        else window.open(u, '_blank', 'noopener');
        break;
      }
      case 'copiar-frase': {
        const f = fuenteDe(id);
        const ok = await copiarTexto((f && f.frase_prueba) || '');
        toast(ok ? 'Frase copiada al portapapeles.' : 'No se pudo copiar. Selecciona la frase y cópiala manualmente.', !ok);
        break;
      }
      case 'registrar': {
        await irA('repositorio');
        abrirFormProv(null, { prefill: { fuente_id: id, tematica_id: el.dataset.tema || '' } });
        break;
      }
      case 'registrar-busqueda': abrirRegistroBusqueda(id, el.dataset.tema || ''); break;
      case 'imp-plantilla': descargarPlantilla(); break;
      case 'imp-paso': S.imp.paso = Number(el.dataset.paso); S.imp.aviso = ''; if (S.imp.paso !== 4) S.imp.prev = null; renderTab(); break;
      case 'imp-confirmar': await confirmarImportacion(); break;
      case 'imp-nueva': { const ant = S.imp; S.imp = Object.assign(imp0(), { fuente: ant.fuente, tema: ant.tema }); renderTab(); break; }
      case 'nueva-prov': abrirFormProv(null); break;
      case 'ver-prov': {
        const p = S.providencias.find((x) => String(x.id) === String(id));
        if (!p) toast('No se encontró la providencia.', true);
        else abrirFormProv(p);
        break;
      }
      case 'validar': await validarProv(id, el.dataset.estado); break;
      case 'nueva-linea': abrirNuevaLinea(); break;
      case 'ficha-linea': {
        const l = S.lineas.find((x) => String(x.id) === String(id));
        if (l) abrirFicha(l);
        break;
      }
      case 'cerrar-modal': cerrarModal(); break;
      case 'copiar-prompt': {
        const t = $('#an-texto').value.trim();
        if (!t) { toast('Pega primero el texto de la sentencia.', true); break; }
        const ok = await copiarTexto(construirPrompt(t));
        toast(ok ? 'Prompt copiado. Pégalo en tu asistente.' : 'No se pudo copiar el prompt.', !ok);
        break;
      }
      case 'cargar-analisis': cargarAnalisis(); break;
      case 'toggle-prio': await togglePrio(id); break;
      case 'guardar-rol': await guardarRol(id); break;
      case 'exportar-csv': exportarRepo(); break;
      case 'quitar-filtro': quitarFiltro(el.dataset.filtro); break;
      case 'limpiar-filtros': limpiarFiltrosRepo(); break;
      case 'rep-pag': cambiarPaginaRepo(el.dataset.pag); break;
    }
  } catch (err) {
    toast(msgError(err), true);
  }
});

document.addEventListener('input', onFiltro);
document.addEventListener('input', (e) => {
  if (e.target.dataset && e.target.dataset.imp === 'pegado') S.imp.pegado = e.target.value;
});
document.addEventListener('change', (e) => {
  onFiltro(e);
  const t = e.target;
  if (t.dataset && t.dataset.imp === 'archivo') leerArchivo(t.files && t.files[0]);
  if (t.dataset && t.dataset.config) {
    guardarConfig(t.dataset.config, t.checked).catch((err) => {
      t.checked = !t.checked;
      toast(msgError(err), true);
    });
  }
});

function onFiltro(e) {
  const el = e.target;
  if (!el.dataset || !el.dataset.filtro) return;
  const partes = el.dataset.filtro.split(':');
  if (partes[0] === 'repo') {
    const f = S.filtros.repo;
    f[partes[1]] = el.type === 'checkbox' ? (el.checked ? '1' : '') : el.value;
    f.pagina = 1;
    if (partes[1] === 'texto') {
      // Debounce de 200 ms: no se repinta la lista en cada pulsación.
      clearTimeout(debRepo);
      debRepo = setTimeout(renderRepoLista, 200);
    } else {
      renderRepoLista();
    }
  } else if (partes[0] === 'lineas') {
    S.filtros.lineas[partes[1]] = el.value;
    renderLineas();
  }
}

document.addEventListener('submit', async (e) => {
  const f = e.target;
  e.preventDefault();
  try {
    switch (f.id) {
      case 'form-auth': await enviarAuth(f); break;
      case 'form-busqueda': {
        const texto = String(new FormData(f).get('q') || '').trim();
        if (!texto) { toast('Escribe un tema o frase para buscar.', true); break; }
        S.busqueda = texto; S.buscado = true;
        renderBusqueda();
        escalonar($('#busq-resultados'));
        break;
      }
      case 'form-imp-1': {
        const fd = new FormData(f);
        S.imp.fuente = String(fd.get('fuente_id') || '');
        S.imp.tema = String(fd.get('tematica_id') || '');
        S.imp.aviso = (S.imp.fuente && S.imp.tema) ? '' : 'Elige la fuente y la temática.';
        if (!S.imp.aviso) S.imp.paso = 2;
        renderTab();
        break;
      }
      case 'form-imp-2': importarTexto(); break;
      case 'form-imp-3': mapearColumnas(f); break;
      case 'form-captura': await guardarCaptura(f); break;
      case 'form-prov': await guardarProv(f); break;
      case 'form-ficha': await guardarFicha(f); break;
      case 'form-nueva-linea': await crearLinea(f); break;
      case 'form-nombre': await guardarNombre(f); break;
      case 'form-pass': await cambiarPass(f); break;
      case 'form-tematica': await crearTematica(f); break;
    }
  } catch (err) {
    toast(msgError(err), true);
  }
});

document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape' && !$('#modal').hidden) cerrarModal();
});
$('#modal').addEventListener('click', (e) => {
  if (e.target.id === 'modal') cerrarModal();
});

if (!sb) {
  $('#app').innerHTML = '<p class="cargando">No se pudo cargar la librería de Supabase. Revisa tu conexión y recarga la página.</p>';
}
})();
</script>
</body>
</html>
